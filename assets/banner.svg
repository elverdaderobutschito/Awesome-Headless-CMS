<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#07080d" />
    </linearGradient>

    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .anim-float {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .anim-dash {
        stroke-dasharray: 6 6;
        animation: dashMove 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Geometric Grid Background Pattern -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Ambient Glowing Blobs -->
  <circle class="anim-pulse" cx="200" cy="100" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
  <circle class="anim-pulse" cx="1020" cy="200" r="160" fill="#ec4899" filter="url(#glow)" opacity="0.25" />
  <circle class="anim-pulse" cx="600" cy="300" r="120" fill="#06b6d4" filter="url(#glow)" opacity="0.2" />

  <!-- CMS Architecture Visual Representation on Right Side -->
  <g class="anim-float" transform="translate(80, 0)">
    <!-- Central Content Lake / Core Node -->
    <rect x="760" y="130" width="140" height="100" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2" filter="url(#subtleGlow)" />
    <text x="830" y="172" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">📦 CONTENT</text>
    <text x="830" y="195" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">REST / GraphQL</text>

    <!-- Connecting Dynamic Flow Lines -->
    <path d="M 900,160 L 980,110" stroke="#06b6d4" stroke-width="2" class="anim-dash" />
    <path d="M 900,180 L 980,180" stroke="#a855f7" stroke-width="2" class="anim-dash" />
    <path d="M 900,200 L 980,250" stroke="#ec4899" stroke-width="2" class="anim-dash" />

    <!-- Decoupled Frontend Endpoints -->
    <!-- Web -->
    <g transform="translate(980, 85)">
      <rect width="105" height="48" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
      <text x="52" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🌐 Web</text>
    </g>
    <!-- Mobile -->
    <g transform="translate(980, 155)">
      <rect width="105" height="48" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
      <text x="52" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📱 Mobile</text>
    </g>
    <!-- Omnichannel -->
    <g transform="translate(980, 225)">
      <rect width="105" height="48" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
      <text x="52" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Omnichannel</text>
    </g>
  </g>

  <!-- Left Side Text & Branding -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <g transform="translate(0, 58)">
      <rect width="210" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="26" y="20" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CURATED CMS DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#primaryGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">Awesome Headless CMS</text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">The Definitive Guide to API-First &amp; Composable Content Systems</text>

    <!-- Tagline & Highlights -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      🚀 Top SaaS Platforms  •  ⚡ Open-Source &amp; Self-Hostable  •  💰 Real Pricing &amp; Star Rankings
    </text>

    <!-- Tech Badges Strip -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="88" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="44" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GraphQL</text>

      <rect x="96" y="0" width="88" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="140" y="18" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">REST APIs</text>

      <rect x="192" y="0" width="98" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="241" y="18" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Git-Backed</text>

      <rect x="298" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="350.5" y="18" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Composable</text>
    </g>
  </g>
</svg>